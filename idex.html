<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,Arial,sans-serif;
    background:#f4f6f9;color:#1f2430;padding-bottom:130px;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ Top bar ============ */
  .topbar{
    display:flex;align-items:center;gap:14px;padding:10px 20px;background:#fff;
    border-bottom:3px solid #c62828;position:sticky;top:0;z-index:600;
    box-shadow:0 2px 14px rgba(20,30,60,.08);
  }
  .topbar .logo{width:48px;height:48px;object-fit:contain;border-radius:10px;background:#fff}
  .brand h1{margin:0;font-size:1.05rem;color:#c62828;font-weight:800}
  .brand p{margin:2px 0 0;font-size:.7rem;color:#6b7488;letter-spacing:.4px}

  .app{max-width:1780px;margin:16px auto;padding:0 16px}
  .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;
        box-shadow:0 2px 16px rgba(20,30,60,.07);border:1px solid #eef1f6}

  /* ============ Upload bar (compact) ============ */
  .upload-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px}
  .upload-bar .file-name{font-size:.82rem;color:#6b7488;font-weight:600}
  .upload-bar .status{flex:1 1 100%;margin:0}

  .status{margin:0;padding:8px 12px;border-radius:8px;font-size:.82rem;font-weight:600;display:none}
  .status.info{display:block;background:#eef4ff;color:#0d47a1;border:1px solid #d3e0fb}
  .status.ok{display:block;background:#eefaf1;color:#1b6b33;border:1px solid #cbeed7}
  .status.error{display:block;background:#fff0f0;color:#a51b1b;border:1px solid #f7d2d2}

  /* ============ Controls ============ */
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .ctl{display:flex;align-items:center;gap:7px;font-size:.82rem;color:#3a4256;font-weight:600;cursor:pointer;user-select:none}
  .ctl input{width:16px;height:16px;accent-color:#c62828;cursor:pointer}
  .spacer{flex:1}

  .btn{
    border:0;border-radius:10px;padding:9px 16px;font-size:.84rem;font-weight:800;
    cursor:pointer;transition:.18s;font-family:inherit;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn-primary{background:#c62828;color:#fff;box-shadow:0 4px 14px rgba(198,40,40,.28)}
  .btn-primary:hover:not(:disabled){background:#a91f1f;transform:translateY(-1px)}
  .btn-outline{background:#fff;color:#c62828;border:2px solid #c62828}
  .btn-outline:hover:not(:disabled){background:#fff2f2}
  .btn-green{background:#1b6b33;color:#fff;box-shadow:0 4px 14px rgba(27,107,51,.25)}
  .btn-green:hover:not(:disabled){background:#155427;transform:translateY(-1px)}
  .btn-ghost{background:#eef1f6;color:#39415a}
  .btn-ghost:hover:not(:disabled){background:#e2e7f0}

  /* ============ Report header ============ */
  .report-head{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding-bottom:12px;margin-bottom:12px;border-bottom:2px solid #f0f2f7;
  }
  .report-head img{width:46px;height:46px;object-fit:contain;border-radius:9px}
  .rh-title h2{margin:0;font-size:1.02rem;color:#c62828;font-weight:800}
  .rh-title p{margin:3px 0 0;font-size:.75rem;color:#6b7488}
  .rh-meta{margin-inline-start:auto;text-align:left;font-size:.74rem;color:#6b7488;line-height:1.7;direction:ltr}
  .rh-meta b{color:#2b3244}

  .stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .stat{background:#f7f9fc;border:1px solid #e6ebf3;border-radius:10px;padding:8px 14px;font-size:.78rem;color:#556}
  .stat b{color:#c62828;font-size:.92rem;display:block;margin-top:2px}

  /* ============ Table ============ */
  .table-wrap{
    max-height:72vh;overflow:auto;border:1px solid #e2e6ee;border-radius:12px;background:#fff;
    scrollbar-width:thin;
  }
  .table-wrap::-webkit-scrollbar{height:11px;width:11px}
  .table-wrap::-webkit-scrollbar-thumb{background:#c9d2e0;border-radius:8px}

  table.report{
    border-collapse:separate;border-spacing:0;direction:ltr;
    width:max-content;min-width:100%;font-size:12px;
  }
  table.report th,table.report td{
    border-right:1px solid #edf0f5;border-bottom:1px solid #edf0f5;
    padding:5px 7px;text-align:center;white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  table.report thead th{
    position:sticky;top:0;background:#c62828;color:#fff;font-weight:700;z-index:3;
    white-space:normal;line-height:1.15;font-size:11px;vertical-align:bottom;
    min-width:62px;max-width:96px;
  }
  table.report thead th.idx{left:0;z-index:6;min-width:40px;max-width:40px;width:40px}
  table.report thead th.item{left:40px;z-index:6;min-width:210px;max-width:210px;width:210px;text-align:left}
  table.report tbody td.idx{
    position:sticky;left:0;background:#fafbfd;z-index:2;color:#98a1b3;font-size:11px;
    min-width:40px;max-width:40px;width:40px;
  }
  table.report tbody td.item{
    position:sticky;left:40px;background:#fff;z-index:2;text-align:left;
    font-weight:600;color:#2b3244;min-width:210px;max-width:210px;width:210px;
  }
  table.report tbody tr:nth-child(even) td{background:#fcfdff}
  table.report tbody tr:nth-child(even) td.item{background:#fcfdff}
  table.report tbody tr:hover td{background:#fff6f6}
  table.report tbody tr:hover td.item{background:#fff6f6}
  table.report td.zero{color:transparent}
  table.report td.total-col,
  table.report th.total-col{background:#fdf1f1!important;font-weight:800;color:#8e1c1c}

  details.notes{margin-top:14px;font-size:.8rem;color:#556}
  details.notes summary{cursor:pointer;font-weight:700;color:#c62828}
  details.notes .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  details.notes .chip{background:#fff3f3;border:1px solid #f6d5d5;color:#a51b1b;
                      border-radius:20px;padding:3px 10px;font-size:.72rem;font-weight:600}

  /* ============ Signature (screen only, smaller 25%, red border, blue text) ============ */
  .signature-card{
    position:fixed;bottom:20px;left:20px;
    background:#ffffff;
    color:#0d47a1;
    padding:7.88px 13.13px;
    border-radius:6.38px;
    border:2px solid #c62828;
    box-shadow:none;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    font-size:0.60rem;
    font-weight:600;
    z-index:1000;
    transition:all .3s ease;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
  }
  .signature-card:hover{transform:scale(1.05)}
  .signature-card .name{font-size:0.7125rem;font-weight:700;margin-bottom:3.75px;color:#0d47a1}
  .signature-card .title{font-size:0.525rem;opacity:.95;font-weight:600;color:#0d47a1}
  @media (max-width:768px){
    .signature-card{position:relative;bottom:auto;left:auto;margin:20px auto 0;width:fit-content}
    .signature-card:hover{transform:none}
  }

  /* ============ Print ============ */
  @media print{
    @page{size:A4 landscape;margin:8mm}
    body{background:#fff;padding:0}
    .topbar,.no-print,.signature-card{display:none!important}
    .card{box-shadow:none;border:0;padding:0;margin:0}
    .table-wrap{max-height:none;overflow:visible;border:0}
    table.report{font-size:7px}
    table.report thead th{background:#c62828!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    table.report td.total-col{background:#fdf1f1!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>

<script>
/* =========================================================================
   1) CONSTANTS
   ========================================================================= */
const LOGO_URL   = 'https://i.postimg.cc/NM2zJWZD/NAIF-LOGO.jpg';
const COMPANY_AR = 'شركة نايف للأغذية';
const COMPANY_EN = 'Naif Food Company';
const DEV_NAME   = 'Yasser Elkhateeb';
const DEV_PHONE  = '67011143';

/* الأصناف المطلوبة — من ملف: الأصناف المطلوبه.xlsx */
const ITEMS = [
  "Cheesy Fries",
  "Chick Fries",
  "COLE SLAW Large _Z",
  "COLE SLAW Small _Z",
  "Fattoush _Z",
  "Hummus _Z",
  "Large Barbecue Sauce",
  "Large Cheddar Sauce",
  "Large Chilli Mayo Sauce",
  "large dynamite garlic",
  "Large Honey Mustard",
  "Large Maboug Sauce",
  "Large Mayo Ketchup",
  "Large Mayonnaise Sauce",
  "Large Peri Peri Sauce",
  "Large Ranch Sauce",
  "Large Spicy Cheese sauce",
  "large sweet spicy sauce",
  "mutabbal",
  "ONION RINGS _Z",
  "ONION RINGS FAMILY_Z",
  "Puri Bread_Z",
  "Rocca Salad _Z",
  "Tabbouleh _Z",
  "XLarge Barbecue Sauce",
  "xlarge cheddar sauce",
  "XLarge Chilli Mayo Sauce",
  "XLarge Honey Mustard",
  "xlarge maboug sauce",
  "xlarge mayo ketchup",
  "xlarge mayonnaise sauce",
  "XLarge Peri Peri Sauce",
  "xlarge pink sauce",
  "xlarge ranch sauce",
  "xlarge spicy cheese sauce",
  "xlarge sweet spicy sauce",
  "Large French Garlic",
  "XLarge French Garlic",
  "Protein Salad - Z",
  "Large Pink Sauce",
  "XLarge Pink Sauce",
  "RICE W MILK_Z",
  "Sweet Corn"
];

/* المطاعم / الأفرع — من ملف: المطاعم.xlsx */
const SITES = [
  "360 Mall","Abu Fatira Co-Op","Abu Halifa","Ahmadi Ind","Airport","Al Rai","AlKout",
  "Avenues","Dabaya","Dasma","Fahaheel","Faiha","Farwaniya","Fintas","Hadiya",
  "Hawally Park","Jaber Al-Ahmed","Jabriya 1 - Jabriya Tikka","Jabriya 2 - Jabriya BD",
  "Jahra 2 - Jahra Ind","Jahra Layaly Elsharq","Jahra Makkah","Jahra1-Duwaik",
  "Jleeb Al-Shiyoukh","Kabed","Khairan Oia","Khairan Outlet Mall","Khaitan Airport Road",
  "Khaitan New","Khioul","Mangaf","Marina Mall","Mishref","New Ardiya","New Farwaniya",
  "Qadsiya","Qairawan","Qurain","Reggai","Riqqa","Saad Al Abdullah","Sabah al Ahmed",
  "Sabah Salem","Sabah-Salem Alareen","Salmiya 1 - Nafura","Salmiya 2 - Sindhibad",
  "Salmiya 3 - Bahrain Street","Salmiya 4 - Sayed Yasin","Salwa","Sharq","Shuhada",
  "Shuwaikh","Souq Qurain","Sulaibiya CO-OP","Sulebhikat","Suleibiya","Wafra",
  "West Abu Fatira","Zahra"
];

/* =========================================================================
   2) HELPERS
   ========================================================================= */
const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
const esc  = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');

function fmtNum(n){
  if (!n) return '';
  const r = Math.round(n * 100) / 100;
  return Number.isInteger(r) ? String(r) : r.toFixed(2);
}
function toNum(v){
  if (v === '' || v === null || v === undefined) return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
  return isFinite(n) ? n : 0;
}
function nowStamp(){
  const d = new Date();
  return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function dateStamp(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

const SITE_NORMS = new Map(SITES.map(s => [norm(s), s]));
const ITEM_NORMS = new Map(ITEMS.map(s => [norm(s), s]));

const siteCache = new Map();
function resolveSiteName(raw){
  if (siteCache.has(raw)) return siteCache.get(raw);
  const n = norm(raw);
  let out = null;
  if (SITE_NORMS.has(n)) {
    out = SITE_NORMS.get(n);
  } else {
    const cands = SITES.filter(s => {
      const ns = norm(s);
      if (ns === n) return true;
      if (Math.min(ns.length, n.length) < 7) return false;
      return ns.startsWith(n) || n.startsWith(ns);
    });
    if (cands.length === 1) out = cands[0];
  }
  siteCache.set(raw, out);
  return out;
}

/* =========================================================================
   3) PARSING  (Product Mix by Site Subgroups)
   ========================================================================= */
function isNoiseRow(a){
  const l = a.toLowerCase();
  if (l === 'meal name') return true;
  if (l.startsWith('from ') && l.includes(' to ')) return true;
  if (l.startsWith('agent product mix')) return true;
  if (l.startsWith('kuwait -')) return true;
  if (l.startsWith('subgroups')) return true;
  if (/^\d+\s*of\s*\d+$/.test(l)) return true;
  if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/.test(l)) return true;
  return false;
}

function parseSheetRows(rows, acc){
  let headerIdx = -1, qtyCol = 3;
  for (let i = 0; i < rows.length; i++){
    const r = rows[i] || [];
    for (let c = 0; c < r.length; c++){
      if (String(r[c] ?? '').trim().toLowerCase() === 'meal name'){
        headerIdx = i;
        for (let cc = 0; cc < r.length; cc++){
          const h = String(r[cc] ?? '').trim().toLowerCase();
          if (h.includes('meal qty')) qtyCol = cc;
        }
        break;
      }
    }
    if (headerIdx >= 0) break;
  }
  if (headerIdx < 0) return false;

  for (let i = 0; i < headerIdx; i++){
    const a = String((rows[i] || [])[0] ?? '').trim();
    if (/^from\s+/i.test(a) && !acc.period) acc.period = a.replace(/\s+/g, ' ');
    if (/^kuwait\s*-/i.test(a) && !acc.operator) acc.operator = a;
  }

  let currentSite = null;

  for (let i = headerIdx + 1; i < rows.length; i++){
    const row = rows[i] || [];
    const a   = String(row[0] ?? '').trim();
    if (!a) continue;
    if (isNoiseRow(a)) continue;

    if (/total/i.test(a)){
      if (/site\s*wise|sitewise/i.test(a)) currentSite = null;
      continue;
    }

    let others = 0;
    for (let c = 1; c < row.length; c++){
      const v = row[c];
      if (v !== '' && v !== null && v !== undefined) others++;
    }

    if (currentSite && others > 0){
      const q = toNum(row[qtyCol]);
      addToSite(acc, currentSite, a, q);
      continue;
    }

    if (SITE_NORMS.has(norm(a))){ currentSite = a; touchSite(acc, a); continue; }
    if (/_{2,}\s*Z\s*$/i.test(a)) continue;

    let nextIsItem = false;
    for (let j = i + 1; j < rows.length; j++){
      const nr = rows[j] || [];
      const na = String(nr[0] ?? '').trim();
      if (!na) continue;
      if (isNoiseRow(na)) continue;
      if (/total/i.test(na)) break;
      for (let c = 1; c < nr.length; c++){
        const v = nr[c];
        if (v !== '' && v !== null && v !== undefined){ nextIsItem = true; break; }
      }
      break;
    }
    if (currentSite && nextIsItem) continue;

    currentSite = a;
    touchSite(acc, a);
  }
  return true;
}

function touchSite(acc, site){
  if (!acc.sites.has(site)){
    acc.sites.set(site, new Map());
    acc.siteOrder.push(site);
  }
}
function addToSite(acc, site, item, qty){
  touchSite(acc, site);
  const m = acc.sites.get(site);
  m.set(item, (m.get(item) || 0) + qty);
  const k = norm(item);
  if (!acc.itemRaw.has(k)) acc.itemRaw.set(k, item);
}

/* =========================================================================
   4) BUILD REPORT MATRIX
   ========================================================================= */
function buildReport(parsed, opts){
  const siteData = new Map();

  for (const rawSite of parsed.siteOrder){
    const itemsMap = parsed.sites.get(rawSite);
    if (!itemsMap) continue;
    const canonical = resolveSiteName(rawSite) || rawSite;
    if (!siteData.has(canonical)) siteData.set(canonical, new Map());
    const tgt = siteData.get(canonical);
    for (const [rawItem, q] of itemsMap){
      const k = norm(rawItem);
      tgt.set(k, (tgt.get(k) || 0) + q);
    }
  }

  let cols = SITES.filter(s => siteData.has(s));
  const extras = [...siteData.keys()].filter(s => !SITES.includes(s));
  cols = cols.concat(extras);
  if (opts.allSites) cols = SITES.concat(extras);

  let rows = ITEMS.map(name => {
    const k = norm(name);
    const values = cols.map(c => {
      const m = siteData.get(c);
      return m ? (m.get(k) || 0) : 0;
    });
    const total = values.reduce((a, b) => a + b, 0);
    return { name, values, total };
  });

  if (opts.hideEmpty) rows = rows.filter(r => r.total > 0);

  const siteTotals = cols.map((_, ci) => rows.reduce((s, r) => s + r.values[ci], 0));
  const grandTotal = rows.reduce((s, r) => s + r.total, 0);

  const unmatched = [];
  for (const [k, raw] of parsed.itemRaw) if (!ITEM_NORMS.has(k)) unmatched.push(raw);

  return { sites: cols, rows, siteTotals, grandTotal, period: parsed.period, operator: parsed.operator, unmatched };
}

/* =========================================================================
   5) RENDER
   ========================================================================= */
const state = { parsed: null, report: null, opts: { allSites: false, hideEmpty: false } };

function setStatus(msg, type){
  const el = document.getElementById('status');
  el.className = 'status ' + (type || 'info');
  el.textContent = msg || '';
}

function render(){
  if (!state.parsed) return;
  const R = buildReport(state.parsed, state.opts);
  state.report = R;

  document.getElementById('controls').hidden = false;
  document.getElementById('reportCard').hidden = false;

  /* --- Meta --- */
  const meta = document.getElementById('reportMeta');
  meta.innerHTML =
    `<div><b>Generated:</b> ${esc(nowStamp())}</div>` +
    (R.period ? `<div><b>Period:</b> ${esc(R.period)}</div>` : '') +
    (R.operator ? `<div><b>Operator:</b> ${esc(R.operator)}</div>` : '');

  /* --- Stats --- */
  document.getElementById('reportStats').innerHTML =
    `<div class="stat">عدد المطاعم<b>${R.sites.length}</b></div>` +
    `<div class="stat">عدد الأصناف<b>${R.rows.length}</b></div>` +
    `<div class="stat">إجمالي الكميات<b>${fmtNum(R.grandTotal) || '0'}</b></div>`;

  /* --- Table head --- */
  let th = `<th class="idx">#</th><th class="item">Item</th>`;
  R.sites.forEach(s => { th += `<th>${esc(s)}</th>`; });
  th += `<th class="total-col">Total</th>`;
  document.getElementById('theadRow').innerHTML = th;

  /* --- Table body: empty cells for zero (no "0" printed) --- */
  let tb = '';
  R.rows.forEach((r, i) => {
    tb += `<tr><td class="idx">${i + 1}</td><td class="item">${esc(r.name)}</td>`;
    r.values.forEach(v => {
      tb += `<td class="num${v ? '' : ' zero'}">${v ? fmtNum(v) : ''}</td>`;
    });
    tb += `<td class="num total-col">${r.total ? fmtNum(r.total) : ''}</td></tr>`;
  });
  document.getElementById('tbodyReport').innerHTML = tb;

  /* --- Notes --- */
  const notes = document.getElementById('notesBox');
  const chips = document.getElementById('notesChips');
  if (R.unmatched.length){
    notes.hidden = false;
    chips.innerHTML = R.unmatched.slice(0, 200).map(n => `<span class="chip">${esc(n)}</span>`).join('');
  } else {
    notes.hidden = true;
  }

  setStatus(`تم التحليل بنجاح — ${R.sites.length} مطعم × ${R.rows.length} صنف.`, 'ok');
}

/* =========================================================================
   6) FILE HANDLING
   ========================================================================= */
async function handleFile(file){
  if (!file) return;
  document.getElementById('fileName').textContent = file.name;
  setStatus('جاري قراءة الملف وتحليله...', 'info');

  try{
    const buf = await file.arrayBuffer();
    const wb  = XLSX.read(buf, { type: 'array', cellDates: false });

    const acc = {
      sites: new Map(),
      siteOrder: [],
      itemRaw: new Map(),
      period: '',
      operator: '',
      sheets: 0
    };

    let found = false;
    for (const name of wb.SheetNames){
      const ws = wb.Sheets[name];
      if (!ws || !ws['!ref']) continue;
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '', blankrows: false });
      if (!rows || !rows.length) continue;
      if (parseSheetRows(rows, acc)){ found = true; acc.sheets++; }
    }

    if (!found){
      setStatus('لم يتم العثور على جدول Product Mix داخل الملف. تأكد من اختيار الملف الصحيح.', 'error');
      return;
    }
    if (!acc.sites.size){
      setStatus('تم العثور على الترويسة لكن لم يتم استخراج أي بيانات. تحقق من بنية الملف.', 'error');
      return;
    }

    state.parsed = acc;
    siteCache.clear();
    render();

  } catch (err){
    console.error(err);
    setStatus('حدث خطأ أثناء قراءة الملف: ' + err.message, 'error');
  }
}

/* =========================================================================
   7) XLSX EXPORT  (thin grid borders + header fill)
   ========================================================================= */
function exportXLSX(){
  if (!state.report){ alert('يرجى رفع ملف البيانات أولاً.'); return; }
  const R = state.report;

  /* مصفوفة البيانات — خلايا صفرية تُترك فارغة */
  const aoa = [
    ['#', 'Item', ...R.sites, 'Total'],
    ...R.rows.map((r, i) => [
      i + 1,
      r.name,
      ...r.values.map(v => v ? +fmtNum(v) : ''),
      r.total ? +fmtNum(r.total) : ''
    ])
  ];

  const ws = XLSX.utils.aoa_to_sheet(aoa);

  /* عرض الأعمدة */
  ws['!cols'] = [
    { wch: 5 },
    { wch: 32 },
    ...R.sites.map(() => ({ wch: 12 })),
    { wch: 10 }
  ];

  /* حدود رفيعة لكل الخلايا */
  const thin = { style: 'thin', color: { rgb: 'C0C0C0' } };
  const border = { top: thin, bottom: thin, left: thin, right: thin };

  const range = XLSX.utils.decode_range(ws['!ref']);
  const lastCol = range.e.c;

  for (let r = range.s.r; r <= range.e.r; r++){
    for (let c = range.s.c; c <= range.e.c; c++){
      const addr = XLSX.utils.encode_cell({ r, c });
      if (!ws[addr]) ws[addr] = { t: 's', v: '' };

      const isHeader = r === 0;
      const isTotalCol = c === lastCol;
      const isItemCol = c === 1;
      const isIdxCol = c === 0;

      ws[addr].s = {
        border,
        font: {
          name: 'Calibri',
          sz: isHeader ? 11 : 10,
          bold: isHeader || isTotalCol,
          color: { rgb: isHeader ? 'FFFFFF' : (isTotalCol ? '8E1C1C' : '2B3244') }
        },
        fill: {
          fgColor: {
            rgb: isHeader ? 'C62828' :
                 (isTotalCol ? 'FDF1F1' :
                  (r % 2 === 0 ? 'FCFDFF' : 'FFFFFF'))
          }
        },
        alignment: {
          horizontal: isItemCol ? 'left' : 'center',
          vertical: 'center',
          wrapText: isHeader || isItemCol
        }
      };
    }
  }

  /* ارتفاع صف الرأس */
  ws['!rows'] = [{ hpt: 30 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Required Items');
  XLSX.writeFile(wb, `Naif-Required-Items-${dateStamp()}.xlsx`);
}

/* =========================================================================
   8) PDF EXPORT  (single-width page, no signature, no bottom totals)
   ========================================================================= */
function loadImageData(src){
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try{
        const c = document.createElement('canvas');
        c.width = img.width; c.height = img.height;
        c.getContext('2d').drawImage(img, 0, 0);
        resolve(c.toDataURL('image/jpeg', 0.9));
      } catch(e){ resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function drawDocHeader(doc, R, logo, pageW){
  if (logo){ try{ doc.addImage(logo, 'JPEG', 18, 10, 40, 40); }catch(e){} }

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(14);
  doc.setTextColor(198, 40, 40);
  doc.text(COMPANY_EN, pageW / 2, 22, { align: 'center' });

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.setTextColor(70, 76, 90);
  doc.text('Required Items Quantities by Site', pageW / 2, 34, { align: 'center' });

  let line3 = 'Generated: ' + nowStamp();
  if (R.period) line3 += '     |     ' + R.period;
  doc.setFontSize(7);
  doc.setTextColor(110, 116, 130);
  doc.text(line3, pageW / 2, 44, { align: 'center' });

  doc.setDrawColor(198, 40, 40);
  doc.setLineWidth(1);
  doc.line(18, 50, pageW - 18, 50);

  return 58;
}

/* لا توقيع على الورقة — فقط رقم صفحة وشريط الشركة */
function drawFooter(doc, p, total, pageW, pageH){
  const y = pageH - 18;
  doc.setDrawColor(198, 40, 40);
  doc.setLineWidth(0.8);
  doc.line(18, y - 8, pageW - 18, y - 8);

  doc.setTextColor(110, 116, 130);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7);
  doc.text(`${COMPANY_EN}   |   ${nowStamp()}   |   Page ${p} of ${total}`,
           pageW / 2, y, { align: 'center' });
}

async function exportPDF(){
  if (!state.report){ alert('يرجى رفع ملف البيانات أولاً.'); return; }
  const R = state.report;
  const btn = document.getElementById('btnPdf');
  const oldLabel = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '⏳ جاري التصدير...';

  try{
    const { jsPDF } = window.jspdf;
    const doc   = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4', compress: true });
    const pageW = doc.internal.pageSize.getWidth();   // 842
    const pageH = doc.internal.pageSize.getHeight();  // 595

    const logo   = await loadImageData(LOGO_URL);
    const startY = drawDocHeader(doc, R, logo, pageW);

    const n = R.sites.length;

    /* ---------- حساب عرض الأعمدة لضمان صفحة واحدة أفقياً ---------- */
    const availW = pageW - 36; // 806
    const idxW  = 12;
    const itemW = 100;
    const totW  = 20;
    const forSites = availW - idxW - itemW - totW; // 674
    const siteW = Math.max(6, Math.floor(forSites / Math.max(n, 1)));

    /* حجم الخط يقل كلما زاد عدد المطاعم */
    let baseFont;
    if (n <= 15) baseFont = 6.2;
    else if (n <= 25) baseFont = 5.4;
    else if (n <= 40) baseFont = 4.6;
    else if (n <= 55) baseFont = 4.0;
    else baseFont = 3.5;
    const headFont = Math.max(3, baseFont - 0.8);

    /* ---------- بناء الجدول ---------- */
    const head = [['#', 'Item', ...R.sites, 'Total']];
    const body = R.rows.map((r, i) => [
      String(i + 1),
      r.name,
      ...r.values.map(v => v ? fmtNum(v) : ''),
      r.total ? fmtNum(r.total) : ''
    ]);
    /* لا صف إجماليات أسفل الجدول (الأصناف مختلفة) */

    const colStyles = {
      0: { cellWidth: idxW, halign: 'center' },
      1: { cellWidth: itemW, halign: 'left', fontStyle: 'bold' },
      [n + 2]: { cellWidth: totW, fontStyle: 'bold' }
    };
    for (let i = 0; i < n; i++) colStyles[i + 2] = { cellWidth: siteW, halign: 'center' };

    doc.autoTable({
      head, body,
      startY,
      margin: { left: 18, right: 18, top: 26, bottom: 26 },
      theme: 'grid',
      /* ★ منع الانقسام الأفقي — كل الأعمدة في صفحة واحدة */
      horizontalPageBreak: false,
      styles: {
        font: 'helvetica',
        fontSize: baseFont,
        cellPadding: { top: 1.4, bottom: 1.4, left: 0.6, right: 0.6 },
        halign: 'center',
        valign: 'middle',
        lineColor: [212, 218, 228],
        lineWidth: 0.25,
        textColor: [30, 34, 45],
        overflow: 'linebreak'
      },
      headStyles: {
        fillColor: [198, 40, 40],
        textColor: [255, 255, 255],
        fontStyle: 'bold',
        halign: 'center',
        valign: 'bottom',
        fontSize: headFont,
        minCellHeight: 20
      },
      alternateRowStyles: { fillColor: [250, 251, 253] },
      columnStyles: colStyles,
      didParseCell: function(data){
        if (data.section === 'body' && data.column.index === n + 2){
          data.cell.styles.textColor = [140, 25, 25];
        }
      }
    });

    /* ---------- التذييل ورقم الصفحة ---------- */
    const pageCount = doc.getNumberOfPages();
    for (let p = 1; p <= pageCount; p++){
      doc.setPage(p);
      drawFooter(doc, p, pageCount, pageW, pageH);
    }

    doc.save(`Naif-Required-Items-${dateStamp()}.pdf`);

  } catch (err){
    console.error(err);
    alert('حدث خطأ أثناء تصدير PDF: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = oldLabel;
  }
}

    document.getElementById('fileInput').click();
  });

  document.getElementById('fileInput').addEventListener('change', e => {
    if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
    e.target.value = '';
  });

  document.getElementById('optAllSites').addEventListener('change', e => {
    state.opts.allSites = e.target.checked;
    if (state.parsed) render();
  });

  document.getElementById('optHideEmpty').addEventListener('change', e => {
    state.opts.hideEmpty = e.target.checked;
    if (state.parsed) render();
  });

  document.getElementById('btnXlsx').addEventListener('click', exportXLSX);
  document.getElementById('btnPdf').addEventListener('click', exportPDF);
  document.getElementById('btnPrint').addEventListener('click', () => window.print());
})();
